<!doctype html><html lang="ru"><meta charset="utf-8"><title>Матрица адаптивности GremlinDrive</title><style>*{box-sizing:border-box}body{margin:0;background:#e7ebf3;font:14px Arial;color:#24324b}header{padding:14px 24px;background:white;height:52px}iframe{border:0;transform-origin:top left;background:white}#wrap{margin:12px auto;overflow:hidden;border-radius:10px;box-shadow:0 8px 28px #26354a24}</style><header><span id="caption"></span><br><small id="metrics">Проверка раскладки...</small></header><div id="wrap"><iframe id="frame" title="Прототип в контрольном размере"></iframe></div><script>
const p=new URLSearchParams(location.search),w=Number(p.get('w')||1440),h=Number(p.get('h')||900),scale=Math.min(1180/w,640/h,1);document.querySelector('#caption').textContent=`GremlinDrive · ${p.has('mobile')?'мобильный':'web'} · ${w} × ${h} CSS px · ${p.get('theme')||'blue'} · масштаб ${Math.round(scale*100)}%`;
const f=document.querySelector('iframe');f.style.width=w+'px';f.style.height=h+'px';f.style.transform=`scale(${scale})`;f.src='./?screen=files&theme='+(p.get('theme')||'blue')+(p.has('mobile')?'&mobile=1':'');const box=document.querySelector('#wrap');box.style.width=w*scale+'px';box.style.height=h*scale+'px';f.onload=()=>{const d=f.contentDocument,buttons=[...d.querySelectorAll('.row-actions button')].map(b=>b.getBoundingClientRect()).filter(r=>r.width>0);document.querySelector('#metrics').textContent=JSON.stringify({width:d.documentElement.clientWidth,scrollWidth:d.documentElement.scrollWidth,minActionWidth:Math.min(...buttons.map(r=>r.width)),minActionHeight:Math.min(...buttons.map(r=>r.height))})};
</script></html>
