<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GremlinDrive · варианты форм для GOMS</title><link rel="stylesheet" href="../lab5/prototype/style.css"><style>body{padding:28px;max-width:1100px;margin:auto}.pair{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin:24px 0}.card{padding:24px;background:white;border-radius:16px;border:1px solid #dbe5df}.route{padding:12px;background:#eaf4ee;border-radius:8px;font-size:13px}h2{font-size:23px}input,select{pointer-events:none}button{pointer-events:none}@media(max-width:650px){.pair{grid-template-columns:1fr}}</style><h1>Три формы · два варианта</h1><p>Проектные варианты для аналитического сравнения GOMS. В интерактивном прототипе используется сокращённый вариант B. Вариант A намеренно добавляет два промежуточных перехода. Время в отчёте рассчитано по операторам, а не измерено на этой странице.</p><div id="forms"></div><script>
for(const [title,fields] of [['Вход',[['Почта','student@example.test'],['Пароль','laboratory123456']]],['Новая папка',[['Название','Новая_папка1']]],['Ссылка с паролем',[['Срок','14 дней'],['Пароль','demo123456']]]]){const pair=document.createElement('section');pair.className='pair';for(const v of ['A','B']){const card=document.createElement('article');card.className='card';const h=document.createElement('h2');h.textContent=title+' · '+v;card.append(h);const p=document.createElement('p');p.className='route';p.textContent=v==='A'?'Меню → Раздел → Форма':'Прямое действие → Форма';card.append(p);for(const [label,value] of fields){const l=document.createElement('label');l.textContent=label;const i=document.createElement('input');i.value=value;l.append(i);card.append(l)}const b=document.createElement('button');b.className='primary';b.textContent=title==='Вход'?'Войти':title==='Новая папка'?'Создать папку':'Создать ссылку';card.append(b);pair.append(card)}document.querySelector('#forms').append(pair)}
</script></html>
