<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GremlinDrive · тест дерева</title><style>body{font:17px/1.6 system-ui;max-width:760px;margin:40px auto;padding:20px;color:#202c40}button{font:inherit;padding:12px 20px;margin:5px;border:1px solid #bbc8de;border-radius:8px;background:#f5f8ff}small{color:#56647a}#choices{display:flex;flex-direction:column;align-items:start}textarea{width:100%;height:150px}</style><h1>Тест структуры GremlinDrive</h1><p>Локальный инструмент для учебного теста. Это не интерфейс сервиса Treejack. Демонстрационный запуск не является исследованием с пользователями.</p><p id="task"></p><p id="path"></p><div id="choices"></div><button id="back">Назад к корню</button><button id="next">Следующее задание</button><h2>Журнал демонстрации</h2><textarea id="log" readonly aria-label="Журнал ответов"></textarea><p><small>Ответы остаются на странице. В отчёте приложены отдельные синтетические результаты.</small></p><script>
const tree={'Мои файлы':{'Файл':{'История версий':{},'Поделиться':{}},'Новая папка':{}},'Общий доступ':{'Ссылки':{}},'Избранное':{},'Корзина':{'Восстановление':{}}};const tasks=['Вы удалили файл по ошибке. Где его вернуть?','Нужно посмотреть прошлую версию документа. Где искать?','Где просмотреть созданные ссылки?','Где найти отмеченные звёздочкой файлы?'];let index=0,path=[],trail=[],started=performance.now(),rows=[];
const $=s=>document.querySelector(s);function render(){$('#task').textContent=(index+1)+'. '+tasks[index];$('#path').textContent=path.join(' / ')||'Главное меню';$('#choices').replaceChildren();let branch=tree;path.forEach(k=>branch=branch[k]);Object.keys(branch).forEach(k=>{const b=document.createElement('button');b.textContent=k;b.onclick=()=>{path.push(k);trail.push(path.join('/'));if(Object.keys(branch[k]).length)render();else{rows.push({data_origin:'demonstration',task:index+1,selected:path.join('/'),seconds:Math.round((performance.now()-started)/100)/10,trail});$('#log').value=JSON.stringify(rows,null,2);$('#choices').textContent='Ответ записан. Перейдите к следующему заданию.'}};$('#choices').append(b)})}$('#back').onclick=()=>{path=[];trail.push('BACK');render()};$('#next').onclick=()=>{index=(index+1)%tasks.length;path=[];trail=[];started=performance.now();render()};render();
</script></html>
