<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GremlinDrive · тест дерева</title><link rel="stylesheet" href="../lab5/prototype/style.css"><style>body{max-width:800px;margin:32px auto;padding:24px}button,select{min-height:44px;font:inherit;margin:4px}#choices{display:flex;flex-direction:column;align-items:start}textarea{width:100%;height:220px}#task{font-weight:600}#path{color:#5d6f66}</style></head><body><a href="./">К отчёту ЛР6</a><h1>Тест структуры GremlinDrive</h1><p>Локальный демонстрационный инструмент. Ответы остаются на странице; запуск в Treejack и исследование с участниками выполняются отдельно.</p><label>Платформа<select id="device"><option value="desktop">Web</option><option value="mobile">Mobile</option></select></label><p id="task"></p><p id="path"></p><div id="choices"></div><button id="back">Назад к корню</button><button id="next">Следующее задание</button><h2>Журнал демонстрации</h2><textarea id="log" readonly aria-label="Журнал ответов"></textarea><script>
const trees={"desktop": {"Мои файлы": {"Файл": {"Предпросмотр": {}, "Версии": {}, "Комментарии": {}, "Доступ": {}}, "Новая папка": {}, "Загрузить": {}}, "Общие папки": {"Проект GremlinDrive": {"Участники": {}, "Файлы команды": {}}}, "Недавние": {}, "Избранное": {}, "Корзина": {"Восстановление": {}}, "Уведомления": {}, "Профиль": {"Квота и тариф": {"Запросить расширение": {}}, "Настройки": {}}}, "mobile": {"Файлы": {"Файл": {"Предпросмотр": {}, "Версии": {}, "Комментарии": {}, "Доступ": {}}, "Новая папка": {}, "Загрузить": {}}, "Общие": {"Проект GremlinDrive": {"Участники": {}, "Файлы команды": {}}}, "Загрузить": {"Выбрать файлы": {}, "Снять и загрузить": {}, "Очередь": {}}, "Уведомления": {}, "Профиль": {"Квота и тариф": {"Запросить расширение": {}}, "Настройки": {}, "Недавние": {}, "Избранное": {}, "Корзина": {"Восстановление": {}}}}};const tasks=['Вы удалили файл по ошибке. Где его вернуть?','Нужно посмотреть прошлую версию документа. Где искать?','Где пригласить человека в общую папку проекта?','Где запросить увеличение квоты?'];let index=0,path=[],trail=[],started=performance.now(),rows=[];
const $=s=>document.querySelector(s);function render(){$('#task').textContent=(index+1)+'. '+tasks[index];$('#path').textContent=path.join(' / ')||'Главное меню';$('#choices').replaceChildren();let branch=trees[$('#device').value];path.forEach(k=>branch=branch[k]);Object.keys(branch).forEach(k=>{const b=document.createElement('button');b.textContent=k;b.onclick=()=>{path.push(k);trail.push(path.join('/'));if(Object.keys(branch[k]).length)render();else{rows.push({data_origin:'demonstration',device:$('#device').value,task:'C'+(index+1),selected:path.join('/'),seconds:Math.round((performance.now()-started)/100)/10,trail:[...trail]});$('#log').value=JSON.stringify(rows,null,2);$('#choices').textContent='Ответ записан. Перейдите к следующему заданию.'}};$('#choices').append(b)})}function restart(){path=[];trail=[];started=performance.now();render()}$('#back').onclick=()=>{path=[];trail.push('BACK');render()};$('#next').onclick=()=>{index=(index+1)%tasks.length;restart()};$('#device').onchange=restart;render();
</script></body></html>
